  <polygon points="16,1.7 30,11 16,20.3 2,11" fill="#FFDF00"/>

  <path d="M11.5 12.35c2.3-1.7 6-2.15 8.7-1.05" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
</svg>
